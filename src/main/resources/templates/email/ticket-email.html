<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Event Ticket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
        }
        .content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 5px;
        }
        .event-details {
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f4f8;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        .event-details p {
            margin: 8px 0;
        }
        .event-details strong {
            color: #2c3e50;
        }
        .qr-code-section {
            text-align: center;
            margin: 30px 0;
        }
        .qr-code-section img {
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 10px;
            background-color: #ffffff;
        }
        .qr-code-section p {
            margin-top: 15px;
            font-weight: bold;
            color: #2c3e50;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Your Event Ticket</h1>
        </div>
        <div class="content">
            <p>Thank you for registering! Below are the details of your event and your ticket QR code.</p>

            <div class="event-details">
                <p><strong>Event:</strong> <span th:text="${eventName}"></span></p>
                <p><strong>Hosted by:</strong> <span th:text="${eventHostName}"></span></p>
                <p><strong>Start:</strong> <span th:text="${startDateTime}"></span></p>
                <p><strong>End:</strong> <span th:text="${endDateTime}"></span></p>
                <p>
                    <strong>Location:</strong>
                    <span th:text="${addressLine1}"></span><span th:text="${addressLine2}"></span>,
                    <span th:text="${eventCity}"></span>,
                    <span th:text="${eventState}"></span>,
                    <span th:text="${eventCountry}"></span>
                    <span th:text="${postalCode}"></span>
                </p>
            </div>

            <div class="qr-code-section">
                <img src="cid:qrCode" alt="Ticket QR Code" width="250" height="250" />
                <p>Please present this QR code at the event for check-in.</p>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 ScanMeIn.online. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
