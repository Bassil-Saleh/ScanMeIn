# =============================================================================
# Server ("docker") profile configuration.
#
# Activated by setting SPRING_PROFILES_ACTIVE=docker. Intended for running the
# application on a dedicated machine (e.g. a server on your home network)
# behind the Caddy HTTPS reverse proxy via Docker Compose.
#
# Unlike the local application.properties (which is gitignored and holds your
# personal dev values), this file contains NO secrets. Every sensitive or
# environment-specific value is injected at runtime from environment
# variables using Spring's ${PLACEHOLDER} syntax, so the file is safe to
# commit and the same image can run anywhere.
# =============================================================================

spring.application.name=webapp

# ---------------------------------------------------------------------------
# Public base URL used to build links in outgoing emails. This must be the
# HTTPS URL that devices on your network use to reach the frontend, so that
# account verification / password reset / invitation links open correctly on
# phones and other devices.
# ---------------------------------------------------------------------------
app.config.frontend-base-url=${FRONTEND_BASE_URL}

# ---------------------------------------------------------------------------
# MariaDB datasource. The hostname "mariadb" is the Docker Compose service
# name; Docker's embedded DNS resolves it to the database container.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate.
#   update -> keep data across restarts and evolve the schema to match the
#             entities. This is the recommended default for the server so
#             that your test data is not wiped on every container restart.
# (Locally you may still use create-drop via your gitignored
# application.properties; this profile overrides it for the server.)
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ---------------------------------------------------------------------------
# Application secrets. Consumed via @Value in CryptoService, BlindIndexService
# and JwtService. Injected at runtime from the .env file produced by
# scripts/init-secrets.sh and NEVER stored here.
# ---------------------------------------------------------------------------
app.encryption.key-base64=${APP_ENCRYPTION_KEY_BASE64}
app.blind-index.key-base64=${APP_BLIND_INDEX_KEY_BASE64}
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64}

# ---------------------------------------------------------------------------
# Optional CORS policy. Leave empty (the default) to keep the API same-origin
# only, which is correct when it is served behind the Caddy reverse proxy.
# Set it to a comma-separated list of origins (e.g. http://localhost:5173) if
# you ever want to run a separate frontend dev server against this API.
# ---------------------------------------------------------------------------
app.config.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---------------------------------------------------------------------------
# Optional email allowlist. When set to a non-empty, comma-separated list, only
# the listed email addresses and/or domains may register accounts, log in,
# register for public events, receive private-event invitations, or receive
# password-reset / any other emails. Each entry is either a full email address
# (e.g. you@yourdomain.com) or a bare domain (e.g. yourdomain.com, which also
# matches subdomains). Matching is case-insensitive.
#
# Leave EMPTY (the default) to disable the allowlist entirely, which preserves
# open registration for local development and the home-network deployment.
# Set it (via the ALLOWED_EMAIL_DOMAINS env var in .env) before deploying
# publicly so that only you and the people you explicitly add can use the site.
# ---------------------------------------------------------------------------
app.access.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}

# ---------------------------------------------------------------------------
# Email transport (SMTP). This is provider-agnostic:
#
#   * Home network (default): points at the Mailpit container ("mailpit" is the
#     Docker Compose service name). Mailpit needs no authentication or TLS, so
#     the defaults below are correct as-is.
#   * Public server (e.g. EC2): set the SMTP_* env vars in .env to your Amazon
#     SES SMTP endpoint + credentials, e.g.
#       SMTP_HOST=email-smtp.us-east-1.amazonaws.com  SMTP_PORT=587
#       SMTP_AUTH=true  SMTP_STARTTLS=true
#       SMTP_USERNAME=<SES SMTP username>  SMTP_PASSWORD=<SES SMTP password>
#     Mailpit is NOT started there (see compose.yaml profiles).
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# Sender address on all outgoing emails. Must be a verified SES identity/domain
# when using Amazon SES; the default is only valid for local/Mailpit use.
app.config.mail.from-address=${MAIL_FROM_ADDRESS:noreply@ticketproject.local}
