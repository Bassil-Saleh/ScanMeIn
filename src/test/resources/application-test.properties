# This configuration file is used by the unit and integration tests.
# Do not put any sensitive credentials here!
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MariaDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Forces Hibernate to speak H2's SQL dialect, because there are fields
# such as DATETIME which are available in MariaDB but not in H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Tell the HikariCP connection pool to disable auto-commit
spring.datasource.hikari.auto-commit=false
# Tell Hibernate that the connection provider (in this case, HikariCP)
# already handles auto-commit, so Hibernate need not manage it itself.
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
# These are deliberately fake keys used when running database tests.
# Do NOT put your real production keys here!
app.encryption.key-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.blind-index.key-base64=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
# In a production environment, this value would be at least 12, but since
# I want the database tests to run faster, I use a smaller value here.
app.hashing.bcrypt-strength=4
# This is a deliberately fake JWT secret used when running tests.
# Do NOT put your real production secret here!
app.jwt.secret-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# Base URL used for constructing verification links in tests.
app.config.base-url=http://localhost:8080
# Sender address used by EmailService in tests (local/Mailpit default).
app.config.mail.from-address=noreply@ticketproject.local
