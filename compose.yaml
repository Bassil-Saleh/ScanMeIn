# =============================================================================
# Docker Compose stack for running the Ticket Project on a dedicated machine on
# your home network (e.g. a server reachable over Wi-Fi) or on a public server
# (e.g. an AWS EC2 instance fronted by Cloudflare).
#
# Services:
#   mariadb     - MariaDB database (data persisted in a named volume)
#   mailpit     - local SMTP server + web UI for testing emails ("local" profile)
#   backend     - Spring Boot REST API (Java 25)
#   frontend    - React app built with Vite, served by nginx
#   caddy       - HTTPS reverse proxy (the only service that can publish 80/443)
#   cloudflared - Cloudflare Tunnel connector, i.e. the ONLY public ingress on a
#                 public deployment ("tunnel" profile). It dials OUT to
#                 Cloudflare's edge, so the host needs no inbound 80/443 rule at
#                 all and cannot be reached by its raw IP address.
#
# Profiles (activated by the Makefile targets):
#   local  -> Mailpit is started, for a home/LAN deployment (`make up`).
#   tunnel -> cloudflared is started, for a public deployment (`make up-aws`).
# Neither is active by default, which is why `make down`/`make logs`/`make
# clean` activate both: a container left running by an inactive profile keeps
# the ticketnet network attached and Docker then refuses to remove it.
#
# All secrets and environment-specific values come from the gitignored .env
# file generated by scripts/init-secrets.sh. Run `make bootstrap` first.
# =============================================================================

services:
  mariadb:
    image: mariadb:12.3
    container_name: ticketproject-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ticketproject_database}
      MARIADB_USER: ${DB_USERNAME:-ticketproject}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketnet

  mailpit:
    # Only started on a local/home-network deployment via `--profile local`
    # (i.e. `make up`). A plain `docker compose up -d` (or `make up-aws`) does
    # NOT start Mailpit, which is what you want on a public server such as EC2
    # where outgoing email goes to Amazon SES instead.
    profiles: ["local"]
    image: axllent/mailpit:v1.31.0
    container_name: ticketproject-mailpit
    restart: unless-stopped
    ports:
      # Web UI is reachable on the LAN so you can open sent emails (and their
      # QR codes) directly from other devices, e.g. your phone.
      # SMTP (1025) is deliberately NOT published; the backend reaches it on
      # the internal Docker network.
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - ticketnet

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ticketproject-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL must be set in .env}
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-ticketproject_database}
      DB_USERNAME: ${DB_USERNAME:-ticketproject}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      APP_ENCRYPTION_KEY_BASE64: ${APP_ENCRYPTION_KEY_BASE64:?APP_ENCRYPTION_KEY_BASE64 must be set in .env}
      APP_BLIND_INDEX_KEY_BASE64: ${APP_BLIND_INDEX_KEY_BASE64:?APP_BLIND_INDEX_KEY_BASE64 must be set in .env}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:?APP_JWT_SECRET_BASE64 must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Optional email allowlist (comma-separated emails and/or domains).
      # Empty = allowlist disabled (open registration). Set it before a public
      # deployment so only approved addresses can register / log in / receive email.
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      # Email transport. Defaults point at the Mailpit container (started only
      # with `--profile local` on a home network). On a public server (EC2), set
      # these in .env to your Amazon SES SMTP endpoint + credentials, e.g.
      #   SMTP_HOST=email-smtp.us-east-1.amazonaws.com  SMTP_PORT=587
      #   SMTP_AUTH=true  SMTP_STARTTLS=true  SMTP_USERNAME=...  SMTP_PASSWORD=...
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Sender address. Must be a verified SES identity/domain on EC2.
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@ticketproject.local}
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
        # The backend must still start when the "local" profile is inactive
        # (i.e. Mailpit is not running, as on EC2).
        required: false
    networks:
      - ticketnet

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: ticketproject-frontend
    restart: unless-stopped
    networks:
      - ticketnet

  caddy:
    # Custom image (see caddy.Dockerfile) with the Cloudflare DNS provider
    # module compiled in, so the PUBLIC deployment (TLS_MODE=public) can obtain
    # a Let's Encrypt certificate via the DNS-01 challenge. The HOME deployment
    # (TLS_MODE=local) uses the same image but serves the mkcert certificate
    # instead; the extra module is simply unused there.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: ticketproject-caddy:latest
    container_name: ticketproject-caddy
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST must be set in .env}
      # Selects the certificate source in the Caddyfile:
      #   local  -> mkcert cert from ./certs (home / LAN)
      #   public -> Let's Encrypt via the Cloudflare DNS-01 challenge (public)
      # Defaults to local so a plain `docker compose up` stays on the LAN path.
      TLS_MODE: ${TLS_MODE:-local}
      # Let's Encrypt contact address (used when TLS_MODE=public). Optional but
      # recommended so you receive certificate expiry/revocation notices.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Scoped Cloudflare API token (Zone.Zone:Read + Zone.DNS:Edit), read at
      # runtime by Caddy's cloudflare DNS provider (used when TLS_MODE=public).
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # --- Cloudflare Access: origin-side validation ------------------------
      # When CF_ACCESS_MODE=on, Caddy additionally requires every request to
      # carry a Cloudflare Access JWT (the signed `Cf-Access-Jwt-Assertion`
      # header, falling back to the CF_Authorization cookie) issued by your Zero
      # Trust team for this application; anything else gets a 401. That is the
      # origin's proof that the request really passed through Cloudflare Access
      # instead of arriving straight at the origin, so knowing the public IP is
      # no longer enough to reach the site without being on the email allowlist.
      #   off (default) -> do not validate (home/LAN, or Access deliberately
      #                    switched off when the site opens to the public).
      #   on            -> validate; requires the two variables below.
      # It is intentionally independent of TLS_MODE, so enabling or disabling
      # Access never changes how the certificate is obtained.
      CF_ACCESS_MODE: ${CF_ACCESS_MODE:-off}
      # Zero Trust team domain WITHOUT the scheme, e.g. scanmein.cloudflareaccess.com
      # (the Access JWT issuer and the JWKS host: https://<team>/cdn-cgi/access/certs).
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      # Application Audience (AUD) tag of the Access application, from
      # Access -> Applications -> <your app> -> Overview.
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
    ports:
      # 80 is published so Caddy can redirect HTTP -> HTTPS. The DNS-01
      # challenge does NOT require inbound 80 from the internet.
      #
      # CADDY_BIND_ADDR chooses WHICH interface these ports are published on:
      #   0.0.0.0   (default) -> reachable from the network; correct for the
      #                          home/LAN deployment, where devices connect
      #                          straight to Caddy.
      #   127.0.0.1           -> reachable from the host only. Use this on a
      #                          public server fronted by a Cloudflare Tunnel:
      #                          cloudflared reaches Caddy over the internal
      #                          Docker network and needs no published port, so
      #                          there is no inbound path to the origin at all
      #                          (and the EC2 security group needs no 80/443
      #                          rule). You can still debug the site from the
      #                          host itself, or remotely with
      #                          `ssh -L 8443:127.0.0.1:443 <host>`.
      # scripts/init-secrets.sh sets this automatically for a public deployment.
      - "${CADDY_BIND_ADDR:-0.0.0.0}:80:80"
      - "${CADDY_BIND_ADDR:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Deployment-specific snippets imported by the Caddyfile:
      #   caddy/local.caddy / caddy/public.caddy -> the `tls` directive,
      #     selected by TLS_MODE.
      #   caddy/access-off.caddy / caddy/access-on.caddy -> Cloudflare Access
      #     JWT validation at the origin, selected by CF_ACCESS_MODE.
      - ./caddy:/etc/caddy/snippets:ro
      # mkcert cert/key, only used when TLS_MODE=local (harmless otherwise).
      - ./certs:/etc/caddy/certs:ro
      # Persist the ACME account and the issued/renewed Let's Encrypt
      # certificate so restarts do not re-issue (and hit rate limits). Deleting
      # caddy_data discards the certificate.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - ticketnet

  cloudflared:
    # Cloudflare Tunnel connector: the ONLY public ingress of a public
    # deployment (started by `make up-aws`, which activates the "tunnel"
    # profile). cloudflared dials OUT to Cloudflare's edge and keeps the tunnel
    # open, which means:
    #   * the host publishes no inbound 80/443 and the EC2 security group needs
    #     no rule for them (see CADDY_BIND_ADDR on the caddy service above),
    #   * the origin cannot be reached by its raw IP address, so Cloudflare
    #     Access cannot be bypassed by somebody who discovers that address, and
    #   * the hostname is a proxied CNAME to the tunnel rather than an A record,
    #     so the public IP need not be published in DNS at all.
    #
    # Every setting (the tunnel credentials and the public hostname -> service
    # mapping) lives in the TUNNEL_TOKEN created in the Zero Trust dashboard, so
    # no config.yml is mounted and nothing is baked into the image. In the
    # dashboard, point the public hostname at `https://caddy:443` and set the
    # Origin Server Name / HTTP Host Header to SITE_HOST: Caddy serves a real
    # Let's Encrypt certificate for that hostname, so this hop is verified end to
    # end instead of being skipped.
    profiles: ["tunnel"]
    # Version pinned (like mariadb and mailpit above) so rebuilds are
    # reproducible; --no-autoupdate keeps the connector on exactly this version.
    image: cloudflare/cloudflared:2026.9.1
    container_name: ticketproject-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Read from .env; compose fails fast when it is missing. It is passed as an
      # environment variable rather than on the command line so the credential
      # never appears in process listings or `docker inspect` output.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set in .env for a tunnel deployment}
    depends_on:
      - caddy
    networks:
      - ticketnet

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  ticketnet:
    driver: bridge
