# =============================================================================
# Docker Compose stack for running the Ticket Project on a dedicated machine
# on your home network (e.g. a server reachable over Wi-Fi).
#
# Services:
#   mariadb  - MariaDB database (data persisted in a named volume)
#   mailpit  - local SMTP server + web UI for testing emails
#   backend  - Spring Boot REST API (Java 25)
#   frontend - React app built with Vite, served by nginx
#   caddy    - HTTPS reverse proxy (the only service exposed on 80/443)
#
# All secrets and environment-specific values come from the gitignored .env
# file generated by scripts/init-secrets.sh. Run `make bootstrap` first.
# =============================================================================

services:
  mariadb:
    image: mariadb:12.3
    container_name: ticketproject-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ticketproject_database}
      MARIADB_USER: ${DB_USERNAME:-ticketproject}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketnet

  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: ticketproject-mailpit
    restart: unless-stopped
    ports:
      # Web UI is reachable on the LAN so you can open sent emails (and their
      # QR codes) directly from other devices, e.g. your phone.
      # SMTP (1025) is deliberately NOT published; the backend reaches it on
      # the internal Docker network.
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - ticketnet

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ticketproject-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL must be set in .env}
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-ticketproject_database}
      DB_USERNAME: ${DB_USERNAME:-ticketproject}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      APP_ENCRYPTION_KEY_BASE64: ${APP_ENCRYPTION_KEY_BASE64:?APP_ENCRYPTION_KEY_BASE64 must be set in .env}
      APP_BLIND_INDEX_KEY_BASE64: ${APP_BLIND_INDEX_KEY_BASE64:?APP_BLIND_INDEX_KEY_BASE64 must be set in .env}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:?APP_JWT_SECRET_BASE64 must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Optional email allowlist (comma-separated emails and/or domains).
      # Empty = allowlist disabled (open registration). Set it before a public
      # deployment so only approved addresses can register / log in / receive email.
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - ticketnet

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: ticketproject-frontend
    restart: unless-stopped
    networks:
      - ticketnet

  caddy:
    image: caddy:2-alpine
    container_name: ticketproject-caddy
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST must be set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ticketnet

volumes:
  mariadb_data:

networks:
  ticketnet:
    driver: bridge
