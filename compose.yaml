# =============================================================================
# Docker Compose stack for running the Ticket Project on a dedicated machine
# on your home network (e.g. a server reachable over Wi-Fi).
#
# Services:
#   mariadb  - MariaDB database (data persisted in a named volume)
#   mailpit  - local SMTP server + web UI for testing emails
#   backend  - Spring Boot REST API (Java 25)
#   frontend - React app built with Vite, served by nginx
#   caddy    - HTTPS reverse proxy (the only service exposed on 80/443)
#
# All secrets and environment-specific values come from the gitignored .env
# file generated by scripts/init-secrets.sh. Run `make bootstrap` first.
# =============================================================================

services:
  mariadb:
    image: mariadb:12.3
    container_name: ticketproject-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ticketproject_database}
      MARIADB_USER: ${DB_USERNAME:-ticketproject}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketnet

  mailpit:
    # Only started on a local/home-network deployment via `--profile local`
    # (i.e. `make up`). A plain `docker compose up -d` (or `make up-aws`) does
    # NOT start Mailpit, which is what you want on a public server such as EC2
    # where outgoing email goes to Amazon SES instead.
    profiles: ["local"]
    image: axllent/mailpit:v1.31.0
    container_name: ticketproject-mailpit
    restart: unless-stopped
    ports:
      # Web UI is reachable on the LAN so you can open sent emails (and their
      # QR codes) directly from other devices, e.g. your phone.
      # SMTP (1025) is deliberately NOT published; the backend reaches it on
      # the internal Docker network.
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - ticketnet

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ticketproject-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL must be set in .env}
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-ticketproject_database}
      DB_USERNAME: ${DB_USERNAME:-ticketproject}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      APP_ENCRYPTION_KEY_BASE64: ${APP_ENCRYPTION_KEY_BASE64:?APP_ENCRYPTION_KEY_BASE64 must be set in .env}
      APP_BLIND_INDEX_KEY_BASE64: ${APP_BLIND_INDEX_KEY_BASE64:?APP_BLIND_INDEX_KEY_BASE64 must be set in .env}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:?APP_JWT_SECRET_BASE64 must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Optional email allowlist (comma-separated emails and/or domains).
      # Empty = allowlist disabled (open registration). Set it before a public
      # deployment so only approved addresses can register / log in / receive email.
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      # Email transport. Defaults point at the Mailpit container (started only
      # with `--profile local` on a home network). On a public server (EC2), set
      # these in .env to your Amazon SES SMTP endpoint + credentials, e.g.
      #   SMTP_HOST=email-smtp.us-east-1.amazonaws.com  SMTP_PORT=587
      #   SMTP_AUTH=true  SMTP_STARTTLS=true  SMTP_USERNAME=...  SMTP_PASSWORD=...
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Sender address. Must be a verified SES identity/domain on EC2.
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@ticketproject.local}
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
        # The backend must still start when the "local" profile is inactive
        # (i.e. Mailpit is not running, as on EC2).
        required: false
    networks:
      - ticketnet

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: ticketproject-frontend
    restart: unless-stopped
    networks:
      - ticketnet

  caddy:
    # Custom image (see caddy.Dockerfile) with the Cloudflare DNS provider
    # module compiled in, so the PUBLIC deployment (TLS_MODE=public) can obtain
    # a Let's Encrypt certificate via the DNS-01 challenge. The HOME deployment
    # (TLS_MODE=local) uses the same image but serves the mkcert certificate
    # instead; the extra module is simply unused there.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: ticketproject-caddy:latest
    container_name: ticketproject-caddy
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST must be set in .env}
      # Selects the certificate source in the Caddyfile:
      #   local  -> mkcert cert from ./certs (home / LAN)
      #   public -> Let's Encrypt via the Cloudflare DNS-01 challenge (public)
      # Defaults to local so a plain `docker compose up` stays on the LAN path.
      TLS_MODE: ${TLS_MODE:-local}
      # Let's Encrypt contact address (used when TLS_MODE=public). Optional but
      # recommended so you receive certificate expiry/revocation notices.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Scoped Cloudflare API token (Zone.Zone:Read + Zone.DNS:Edit), read at
      # runtime by Caddy's cloudflare DNS provider (used when TLS_MODE=public).
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      # 80 is published so Caddy can redirect HTTP -> HTTPS. The DNS-01
      # challenge does NOT require inbound 80 from the internet, so on a public
      # server the EC2 security group can restrict inbound to 22/443.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Deployment-specific `tls` snippets (caddy/local.caddy, caddy/public.caddy)
      # imported by the Caddyfile based on TLS_MODE.
      - ./caddy:/etc/caddy/snippets:ro
      # mkcert cert/key, only used when TLS_MODE=local (harmless otherwise).
      - ./certs:/etc/caddy/certs:ro
      # Persist the ACME account and the issued/renewed Let's Encrypt
      # certificate so restarts do not re-issue (and hit rate limits). Deleting
      # caddy_data discards the certificate.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - ticketnet

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  ticketnet:
    driver: bridge
