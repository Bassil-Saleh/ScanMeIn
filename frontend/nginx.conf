# Serves the built React frontend as static files with SPA fallback routing
# so that client-side routes (react-router) resolve on refresh / deep links.
#
# The caching policy below is stated explicitly rather than left to defaults,
# because nothing else in this stack declares one (Cloudflare then applies its
# own):
#   * /assets/* - Vite names these after a hash of their contents, so a change
#     produces a NEW filename and they can be cached forever ("immutable"). A
#     MISSING one is a 404, never the SPA shell: a 200 text/html served for a
#     .js URL is a perfectly cacheable success, gets stored under that URL
#     (Cloudflare applies its 4-hour default TTL to .js/.css when the origin
#     sends no Cache-Control), and the browser then refuses to execute the
#     module ("disallowed MIME type (text/html)") - a blank page that survives
#     reloads and even a rebuild, since unchanged source means the same hashes.
#   * index.html - it names the hashed files, so a stale copy points at files
#     that no longer exist. "no-cache" means "store, but always revalidate",
#     which still allows a cheap 304.
#   * everything else - a short explicit TTL instead of Cloudflare's default.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build output. The ^~ modifier keeps the regex location
    # below from overriding these headers for hashed images.
    # Requests are deliberately NOT excluded from the access log: a 404 here is
    # the signal that a client asked for a bundle that is no longer in this
    # image, which is exactly what `docker compose logs frontend` should show.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Other static files copied from public/ (favicon.svg, icons.svg, ...).
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # The HTML shell: always revalidate. This also covers "/" and every deep
    # link, because try_files' fallback performs an internal redirect to
    # /index.html, which re-runs location matching.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routes (react-router deep links).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
